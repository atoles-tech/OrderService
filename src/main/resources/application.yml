server:
  port: 8083

spring:
  profiles:
    active: local
  application:
    name: order_service

  liquibase: 
    change-log: classpath:db/changelog/db.master-changelog.xml
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        sliding-window-size: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 5s
  timelimiter:
    instances:
      user-service:
        timeout-duration: 2s


